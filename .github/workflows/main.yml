name: build-hook
on:
  push:
    paths-ignore:
      - 'libwgkill.dylib'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build arm64 iOS dylib
        run: |
          clang -target arm64-apple-ios15.0 -O2 -dynamiclib \
            -nostdlib -nodefaultlibs -fno-stack-protector -fno-exceptions \
            -fuse-ld=lld -Wl,-undefined,dynamic_lookup \
            wgkill.m -o libwgkill.dylib
          ls -l libwgkill.dylib
      - name: Publish dylib to repo
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"
          git add libwgkill.dylib
          git commit -m "build: libwgkill.dylib" || echo "no change"
          git push
